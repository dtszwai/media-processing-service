syntax = "proto3";

package mediaservice.auth.v1;

option go_package = "github.com/dtszwai/media-processing-service/backend/pkg/contracts/mediaservice/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// APIKey is the listing shape. raw_key is only populated on creation; protojson omits empty strings on list calls.
message APIKey {
  string key_id = 1;
  string raw_key = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  string token = 1;
  string refresh_token = 2;
  string tenant_id = 3;
  string user_id = 4;
  int32 expires_in = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string refresh_token = 2;
  string tenant_id = 3;
  string user_id = 4;
  int32 expires_in = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string token = 1;
  string refresh_token = 2;
  string tenant_id = 3;
  string user_id = 4;
  int32 expires_in = 5;
}

message GetMeRequest {}

message GetMeResponse {
  string tenant_id = 1;
  string user_id = 2;
  string email = 3;
  repeated string roles = 4;
}

message CreateAPIKeyRequest {
  string name = 1;
}

message CreateAPIKeyResponse {
  APIKey key = 1;
}

message ListAPIKeysRequest {}

message ListAPIKeysResponse {
  repeated APIKey keys = 1;
}

message DeleteAPIKeyRequest {
  string key_id = 1;
}

message DeleteAPIKeyResponse {}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);

  rpc Login(LoginRequest) returns (LoginResponse);

  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);

  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);

  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse);
}
