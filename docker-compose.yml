# NOTE: For processing large images (100MB+), increase Docker Desktop memory to 8GB+
# Docker Desktop → Settings → Resources → Memory → 8GB → Apply & Restart
# The Lambda needs ~4GB heap for large image processing via -Xmx in Terraform config.

services:
  redis:
    container_name: media-service-redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - default

  localstack:
    container_name: localstack
    image: localstack/localstack:3.4
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - DEBUG=1
      - PERSISTENCE=1
      - SERVICES=s3,dynamodb,sns,sqs,lambda,iam,events,cloudwatch,secretsmanager
      - AWS_DEFAULT_REGION=us-west-2
      - LAMBDA_DOCKER_NETWORK=media-processing-service_default
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=300
      - LAMBDA_KEEPALIVE_MS=60000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # - "./scripts:/etc/localstack/init/ready.d"
    networks:
      - default

  grafana:
    profiles: ["observability"]
    container_name: grafana-lgtm
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      - GF_PATHS_DATA=/data/grafana
    volumes:
      - "./data/grafana/provisioning/dashboards/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/media-service.yaml"
      - "./data/grafana/dashboards:/otel-lgtm/dashboards"
      - grafana-data:/data/grafana
    networks:
      - default

  api:
    container_name: media-service-api
    build:
      context: ./app
      dockerfile: api/Dockerfile
      additional_contexts:
        scripts: ./scripts
    ports:
      - "9000:9000"
    volumes:
      # Mount the operator's NotebookLM session captured via
      # scripts/notebooklm/login.py. Mounted read-only. If $HOME/.notebooklm
      # does not exist Docker will create an empty dir at that source path —
      # the NotebookLM provider stays NotConfigured until a state.json appears.
      - "${HOME}/.notebooklm:/secrets/notebooklm:ro"
    environment:
      - APP_PORT=9000
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - MEDIA_DYNAMODB_TABLE_NAME=media
      - MEDIA_BUCKET_NAME=media-bucket
      - MEDIA_MANAGEMENT_TOPIC_ARN=arn:aws:sns:us-west-2:000000000000:media-management-topic
      - MEDIA_GENERATION_TOPIC_ARN=arn:aws:sns:us-west-2:000000000000:generation-jobs
      - MEDIA_GENERATION_QUEUE_URL=http://localstack:4566/000000000000/generation-jobs
      - MEDIA_GENERATION_PAID_QUEUE_URL=http://localstack:4566/000000000000/generation-jobs-paid
      - MEDIA_GENERATION_LOCAL_STAGE_POLLER_ENABLED=${MEDIA_GENERATION_LOCAL_STAGE_POLLER_ENABLED:-true}
      - GENERATION_PROVIDER=simulated
      - GENERATION_MODERATION_PROVIDER=simulated
      - GENERATION_TTS_PROVIDER=simulated
      - GENERATION_AUDIO_OVERVIEW_PROVIDER=${GENERATION_AUDIO_OVERVIEW_PROVIDER:-simulated}
      - NOTEBOOKLM_STORAGE_STATE_PATH=/secrets/notebooklm/state.json
      - NOTEBOOKLM_AUTHUSER=${NOTEBOOKLM_AUTHUSER:-1}
      - GENERATION_REGION=us-west-2
      - GENERATION_MODEL=simulator-v1
      - GENERATION_BUDGET_DAILY_USD=50
      - GENERATION_BACKPRESSURE_MAX_QUEUE_DEPTH=500
      - GENERATION_BACKPRESSURE_DELAYED_THRESHOLD_PCT=60
      - GENERATION_BACKPRESSURE_DEGRADED_THRESHOLD_PCT=80
      - GENERATION_FREE_DAILY_LIMIT=25
      - GENERATION_PAID_DAILY_LIMIT=1000
      - GENERATION_FREE_MONTHLY_LIMIT=250
      - GENERATION_PAID_MONTHLY_LIMIT=30000
      - GENERATION_FREE_OUTSTANDING_LIMIT=2
      - GENERATION_PAID_OUTSTANDING_LIMIT=50
      - GENERATION_PROMPT_ENHANCEMENT_ENABLED=true
      - GENERATION_STAGE_MAX_ATTEMPTS=3
      - GENERATION_SIMULATOR_CHAOS_BUSINESS_HOURS_ENABLED=false
      - AWS_SECRETSMANAGER_ENDPOINT=http://localstack:4566
      - AWS_DYNAMODB_ENDPOINT=http://localstack:4566
      - AWS_S3_ENDPOINT=http://localstack:4566
      - AWS_S3_PRESIGNER_ENDPOINT=http://127.0.0.1:4566
      - AWS_SNS_ENDPOINT=http://localstack:4566
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - MEDIA_DLQ_URL=http://localstack:4566/000000000000/media-management-sqs-dlq
      - CLOUDFRONT_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4318
      - OTEL_TRACES_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_SERVICE_NAME=media-service-api
    depends_on:
      - localstack
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v1/media/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - default

volumes:
  redis-data:
  grafana-data:

networks:
  default:
    name: media-processing-service_default
